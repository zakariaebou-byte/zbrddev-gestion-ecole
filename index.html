:root{
  --primary:#6D28D9;
  --primary-light:#F5F3FF;
  --success:#16A34A;
  --warning:#F59E0B;
  --danger:#DC2626;
  --ink:#1F2937;
  --muted:#6B7280;
  --bg:#F9FAFB;
  --surface:#ffffff;
  --border:#E5E7EB;
}

@media (prefers-color-scheme: dark){
  :root{
    --bg:#12101a;
    --surface:#1d1a28;
    --ink:#f3f1fa;
    --muted:#b8b3c8;
    --border:#342f48;
    --primary-light:#2a2140;
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,Inter,Arial,sans-serif;
  font-size:16px
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 4px 18px rgba(31,41,55,.06);
  padding:18px
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border-radius:999px;
  padding:8px 14px;
  font-size:14px;
  font-weight:700;
  border:1px solid transparent;
  line-height:1.2
}

.btn-primary{
  background:var(--primary);
  color:#fff
}

.btn-primary:hover{
  filter:brightness(.92)
}

.btn-ghost{
  background:#fff;
  color:var(--primary);
  border-color:var(--primary)
}

.btn-danger{
  background:var(--danger);
  color:#fff
}

.btn-small{
  padding:6px 11px;
  font-size:13px
}

.chip{
  display:inline-flex;
  align-items:center;
  padding:4px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:800
}

.chip-green{
  background:#dcfce7;
  color:#166534
}

.chip-orange{
  background:#fef3c7;
  color:#92400e
}

.chip-red{
  background:#fee2e2;
  color:#991b1b
}

.chip-violet{
  background:var(--primary-light);
  color:var(--primary)
}

.input{
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px 12px;
  background:var(--surface);
  color:var(--ink);
  min-width:0
}

.label{
  font-size:13px;
  font-weight:700;
  color:var(--muted);
  margin-bottom:5px;
  display:block
}

.page-title{
  font-size:clamp(22px,4vw,32px);
  line-height:1.1;
  font-weight:900;
  letter-spacing:-.02em;
  overflow-wrap:anywhere
}

.muted{
  color:var(--muted)
}

.nav-item{
  width:100%;
  text-align:left;
  display:flex;
  gap:10px;
  align-items:center;
  padding:9px 11px;
  border-radius:11px;
  border:0;
  background:transparent;
  color:var(--ink);
  font-size:14px;
  font-weight:650
}

.nav-item:hover{
  background:var(--primary-light)
}

.nav-item.active{
  background:var(--primary);
  color:#fff
}

.bar{
  height:10px;
  border-radius:999px;
  background:#EDE9FE;
  overflow:hidden
}

.bar > div{
  height:100%;
  background:var(--warning)
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px
}

th{
  text-align:left;
  color:var(--muted);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.04em;
  padding:8px
}

td{
  padding:10px 8px;
  border-top:1px solid var(--border);
  vertical-align:top;
  overflow-wrap:anywhere
}

.wrap{
  overflow-wrap:anywhere
}

.hover\:bg-\[var\(--primary\)\]:hover {
  background-color: var(--primary);
}

@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }

  .sm\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:px-5 {
    padding-left: 1.25rem;

  }

  .sm\:py-5 {

  .md\:inline-flex {

  .md\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px) {
  .lg\:flex {

  }

  .lg\:hidden {
    display: none;
  }

  .lg\:grid-cols-4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
